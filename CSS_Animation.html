<style>
/* Transition(過度效果) */
.button {
  background: blue;
  color: white;
  padding: 10px 20px;
  border: none;
  cursor: pointer;
  transition: all 0.3s ease;
}

.button:hover {
  background: red;
  transform: scale(1.1); /* 變大 */
}

/* @keyframes（關鍵影格動畫） */
@keyframes moveRight {
  0% { transform: translateX(0); }
  100% { transform: translateX(200px); }
}

.box {
  width: 100px;
  height: 100px;
  background: lightblue;
  animation: moveRight 2s ease-in-out infinite alternate;
}
</style>

<div>
  <button class="button">點我！</button>
  <div class="box"></div>
</div>
