<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首頁</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding-top: 15vh; /* 使用視窗高度比例來推疊，讓內容垂直偏中 */
            background-color: #f8f9fa;
            color: #333;
        }
        h1 { 
            color: #2c3e50; 
            font-size: 3em;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 40px;
        }
        
        /* 導覽連結的樣式 */
        .nav-link {
            display: inline-block;
            padding: 12px 30px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 30px; /* 改成圓角按鈕，看起來更現代 */
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.2);
        }
        .nav-link:hover {
            background-color: #0056b3;
            box-shadow: 0 6px 12px rgba(0, 123, 255, 0.3);
            transform: translateY(-2px); /* 滑鼠懸停時會有微微浮起的動畫 */
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>{{ greeting }}</h1>
        <p>歡迎來到我的專屬空間，這裡記錄了我的生活日常與專案。</p>
        
        <a href="aboutme.html" class="nav-link">認識我更多 👉</a>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    // 這裡可以隨時修改你想顯示的主標題
                    greeting: "Hello, 我是 MingYou！"
                };
            }
        }).mount("#app");
    </script>
</body>
</html>
